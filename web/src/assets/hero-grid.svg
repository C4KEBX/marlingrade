<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" fill="none" preserveAspectRatio="xMidYMax slice" role="presentation">
  <g stroke="#46C3C4" font-family="ui-monospace, 'JetBrains Mono', monospace">
