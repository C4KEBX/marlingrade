      <path d="M800 -20 L800 660" /><path d="M1030 -20 L1030 660" />
      <path d="M1290 -20 L1290 660" /><path d="M1510 -20 L1510 660" />
      <path d="M-20 110 L1620 110" /><path d="M-20 400 L1620 400" />
