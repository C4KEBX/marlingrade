    <!-- focus parcel — bottom band, clear of the copy and the auth card -->
    <rect x="470" y="452" width="330" height="120"
      fill="#46C3C4" fill-opacity="0.08" stroke-opacity="0.65" stroke-width="1.9" />
    <g stroke="#46C3C4" stroke-opacity="0.8" stroke-width="1.6" fill="none">
      <circle cx="470" cy="452" r="4.5" /><circle cx="800" cy="452" r="4.5" />
      <circle cx="470" cy="572" r="4.5" /><circle cx="800" cy="572" r="4.5" />
    </g>

