      <circle cx="800" cy="110" r="3" /><circle cx="1030" cy="110" r="3" />
      <circle cx="1510" cy="110" r="3" /><circle cx="170" cy="400" r="3" />
      <circle cx="470" cy="540" r="3" /><circle cx="800" cy="400" r="3" />
